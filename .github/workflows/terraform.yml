name: Terraform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Test the DEV warm-up probes
        run: python3 -m unittest discover -s tests -p test_start_dev_apps.py
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color
      - run: terraform test -no-color
      - name: Test the deployment verifier with CLI fixtures
        shell: pwsh
        run: ./tests/Test-PortfolioDeployment.ps1
